name: News bot

# Запускает бота cron-job.org (каждые 3 часа) или кнопка Run workflow.
on:
  workflow_dispatch:
    inputs:
      vk_test:
        description: "Только проверить ВКонтакте (повторить последний пост)"
        type: boolean
        default: false

permissions:
  contents: write             # чтобы сохранять state.json

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot   # бот сам сохраняет память после каждого поста
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TELEGRAM_CHANNEL: "@newsfrom1AC"
        run: python news_bot.py ${{ inputs.vk_test && '--vk-test' || '' }}
